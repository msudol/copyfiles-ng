name: Publish Package to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    # ⚠️ CRITICAL: Required for OIDC trusted publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Enforce latest npm version to ensure OIDC capability
      - name: Update npm
        run: npm install -g npm@latest

      # Run publish without providing an NPM_TOKEN environment variable
      - name: Publish to npm
        run: npm publish --provenance
